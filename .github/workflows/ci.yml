name: CI

on:
  pull_request:
  push:
    branches: [main]

# The private repo runs on the owner's own runner (label `box`); the public copy
# keeps GitHub's hosted runner. A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # pnpm at the version package.json's packageManager names.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Every app and server suite, each run even when one fails, with a summary at
      # the end (scripts/test.mjs). The root package has no dependencies of its own.
      - name: tests
        working-directory: .
        run: pnpm test
      # ESLint: undefined names, the rules of hooks, and every suppression says why.
      - run: pnpm run lint
      - run: pnpm run build

  # The iPhone app: strict TypeScript over mobile/src, including the lib copies.
  # mobile/ stays on npm: under pnpm its bundle came out different.
  mobile:
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
